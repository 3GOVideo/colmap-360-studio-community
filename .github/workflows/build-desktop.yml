name: Build community desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "community-v*"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build DMG
        run: python packaging/build_desktop.py --platform macos
      - uses: actions/upload-artifact@v4
        with:
          name: COLMAP-360-Studio-Community-macOS
          path: dist-community/COLMAP-360-Studio-Community-macOS.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows application
        run: python packaging/build_desktop.py --platform windows
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows-installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: COLMAP-360-Studio-Community-Windows
          path: dist-community/COLMAP-360-Studio-Community-Windows-Setup.exe
